<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalle de Producto | Mueblería Hermanos Jota</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            <a href="index.html">
                Hermanos Jota
            </a>
        </div>

        <nav class="nav" aria-label="Navegación principal">
            <ul>
                <li>
                    <a href="index.html">Inicio</a>
                </li>

                <li>
                    <a href="productos.html">
                        Productos
                    </a>
                </li>

                <li>
                    <a href="contacto.html">

    <main>

        <section class="detalle-producto-section">
